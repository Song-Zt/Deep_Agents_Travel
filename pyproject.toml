description = "Add your description here"
authors = [
    { name = "Song_Zt222", email = "847912698@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.3",
    "mcp==2.3.0",
    "openai>=3.39.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
